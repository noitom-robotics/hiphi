<body>
<main>
  <header><div><p class="eyebrow">G1 robot playback</p><h1>G1 retargeted reference playback</h1><p>Retargeted G1 references are shown with colored robot body links.</p></div><a class="btn" href="../../full.html#g1" target="_top">Back to full page</a></header>

<script type="module">
import * as THREE from 'three';

const JOINT_NAMES=["left_hip_pitch_joint","left_hip_roll_joint","left_hip_yaw_joint","left_knee_joint","left_ankle_pitch_joint","left_ankle_roll_joint","right_hip_pitch_joint","right_hip_roll_joint","right_hip_yaw_joint","right_knee_joint","right_ankle_pitch_joint","right_ankle_roll_joint","waist_yaw_joint","waist_roll_joint","waist_pitch_joint","left_shoulder_pitch_joint","left_shoulder_roll_joint","left_shoulder_yaw_joint","left_elbow_joint","left_wrist_roll_joint","left_wrist_pitch_joint","left_wrist_yaw_joint","right_shoulder_pitch_joint","right_shoulder_roll_joint","right_shoulder_yaw_joint","right_elbow_joint","right_wrist_roll_joint","right_wrist_pitch_joint","right_wrist_yaw_joint"];

function setView(camera,controls,key){const v=VIEWS[key]||VIEWS.iso;camera.position.set(...v.pos);controls.target.set(...v.target);controls.update()}
async function loadJson(path){const r=await fetch(path);if(!r.ok)throw new Error(`Failed to load ${path}`);return r.json()}

function colorShade(hex,shade){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255;return `rgb(${Math.max(0,Math.min(255,r*shade))|0},${Math.max(0,Math.min(255,g*shade))|0},${Math.max(0,Math.min(255,b*shade))|0})`}
